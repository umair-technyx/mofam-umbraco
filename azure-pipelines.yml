trigger:
  branches:
    include:
    - develop
  
pool:
  vmImage: ubuntu-latest

variables:
- group: MOFAM
  
stages:
- stage: Build
  displayName: Build + Push + Prepare Artifact
  jobs:
  - job: build
    displayName: Build job
    steps:
    - checkout: self

    - bash: |
        set -e
        COMMIT_SHA="$(Build.SourceVersion)"
        SHORT_SHA="${COMMIT_SHA:0:7}"
        echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
        echo "$SHORT_SHA" > "$(Build.ArtifactStagingDirectory)/tag.txt"
        echo "SHORT_SHA=$SHORT_SHA"
      displayName: "Compute tag + save tag.txt"

    - task: AzureCLI@2
      displayName: "Build & Push to ACR"
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az acr login --name $(acrName)
          IMAGE="$(acrLoginServer)/$(MofamBeRepo):$(SHORT_SHA)"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
