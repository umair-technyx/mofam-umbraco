apiVersion: apps/v1
kind: Deployment
metadata:
  name: mofam-cms
  namespace: mofam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mofam-cms
  template:
    metadata:
      labels:
        app: mofam-cms
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: mofam-sa
      containers:
      - name: mofam-cms
        image: acrmofamuaen.azurecr.io/mofam-umbraco:a0b178e
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: KeyVault__URL
          value: "https://kv-mofam-uaen.vault.azure.net/"